name: Radar de passagens

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 06:17 (Brasília)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar preços
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python fetch.py
      - name: Viagens monitoradas (voo com data e hotéis)
        if: always()
        continue-on-error: true
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python viagens.py
      - name: Avisar alertas (issue no GitHub = notificação no app)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          try:
              novos = json.load(open("data/alertas_novos.json", encoding="utf-8"))
          except Exception:
              novos = []
          if novos:
              brl = lambda v: "R$ " + f"{v:,.0f}".replace(",", ".")
              linhas = [f"- **{a['item']}** {a.get('extra','')} ({a['viagem']}): {brl(a['de'])} → **{brl(a['para'])}** (−{round(a['queda']*100)}%)" for a in novos]
              corpo = "\n".join(linhas) + "\n\nPainel: https://" + os.environ["GITHUB_REPOSITORY_OWNER"] + ".github.io/" + os.environ["GITHUB_REPOSITORY"].split("/")[1] + "/#viagens"
              subprocess.run(["gh", "issue", "create", "--title", f"🔔 Preço caiu: {len(novos)} alerta(s)", "--body", corpo], check=False)
          PY
      - name: Histórico ANAC
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        run: python anac.py
      - name: Salvar dados
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Atualiza preços $(date -u +%F)"
          git push
