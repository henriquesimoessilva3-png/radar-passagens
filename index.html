<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de Viagens</title>
<style>
:root{--bg:#f3f7f8;--card:#ffffff;--ink:#0f2530;--mut:#5d6f78;--line:#dfe8eb;--acc:#0b8f8c;--acc-2:#ff6a4d;--sea1:#14b8b3;--sea2:#0b6fa4;
--otimo:#0f7a52;--otimo-bg:#dcf5ea;--bom:#3f7d12;--bom-bg:#eaf6d9;--obs:#8a6a00;--obs-bg:#fbf0c9;--norm:#5d6f78;--norm-bg:#edf1f3;--chip:#eef6f6}
@media (prefers-color-scheme:dark){:root{--bg:#0b1419;--card:#131f26;--ink:#eaf3f6;--mut:#94a8b2;--line:#22323b;--acc:#3fd0c9;--acc-2:#ff8a72;--sea1:#0d6f73;--sea2:#0a3f63;
--otimo:#5fe0a6;--otimo-bg:#0e3a28;--bom:#b4e07a;--bom-bg:#26380f;--obs:#f1cf62;--obs-bg:#3b3110;--norm:#94a8b2;--norm-bg:#1d2a32;--chip:#17323a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,Helvetica,sans-serif}
a{color:var(--acc)}
.hero{background:linear-gradient(135deg,var(--sea1),var(--sea2));color:#fff;padding:26px 0 0}
.hero .in,.wrap{max-width:1140px;margin:0 auto;padding:0 16px}
.hero h1{margin:0;font-size:30px;letter-spacing:-.01em}
.hero p{margin:4px 0 18px;opacity:.9;font-size:14px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{border:0;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-weight:700;padding:11px 18px;border-radius:12px 12px 0 0;cursor:pointer}
.nav button.on{background:var(--bg);color:var(--ink)}
.wrap{padding-top:22px;padding-bottom:60px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;color:var(--mut);font:inherit;font-weight:700;padding:7px 12px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.busca{flex:1 1 220px;min-width:200px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:6px 0 24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mut);font-size:12.5px}
h2{font-size:20px;margin:30px 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font-size:13px;color:var(--mut);font-weight:400}
.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.of{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.of.otimo{border-color:var(--otimo)}.of.bom{border-color:var(--bom)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dest{font-weight:700;font-size:17px;line-height:1.25}
.dest small{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag.otimo{background:var(--otimo-bg);color:var(--otimo)}.tag.bom{background:var(--bom-bg);color:var(--bom)}
.tag.observacao{background:var(--obs-bg);color:var(--obs)}.tag.normal{background:var(--norm-bg);color:var(--norm)}
.nums{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.preco{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pct{font-size:22px;font-weight:800;color:var(--otimo)}
.meta{color:var(--mut);font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.links a{font-size:12.5px;font-weight:700;color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:5px 10px;background:var(--card)}
.links a:hover{border-color:var(--acc)}
.extra{border-top:1px solid var(--line);padding-top:8px;font-size:12.5px;color:var(--mut)}
.extra b{color:var(--ink);font-size:14px}
.extra svg{display:block;width:100%;height:auto;margin:4px 0 2px}
.extra .t{font-weight:700;color:var(--ink);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.bar-n{fill:var(--norm)}.bar-min{fill:var(--acc)}.eixo{stroke:var(--line);stroke-width:1}
.lin{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.pt{fill:var(--acc);stroke:var(--card);stroke-width:2}
.rot{font-size:9px;fill:var(--mut);text-anchor:middle}.hit{fill:transparent}.hit:hover{fill:var(--ink);fill-opacity:.08}
.tab{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:13px}
.tab th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line)}
.tab td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tab tr:last-child td{border-bottom:0}
.tab td b{font-size:16px}.tab .g{color:var(--otimo)}.tab .r{color:var(--mut)}
.rolar{overflow-x:auto}.nota{color:var(--mut);font-size:13px;margin:0 0 12px}
.vazio{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:22px;color:var(--mut);text-align:center}
footer{margin-top:36px;color:var(--mut);font-size:12px}
.form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end;margin-bottom:14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:700}
.form input,.form select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.form .chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.form .full{grid-column:1/-1}
.btn{display:inline-block;font:inherit;font-weight:700;font-size:14px;color:#fff;background:var(--acc-2);border:0;border-radius:10px;padding:10px 16px;text-decoration:none;cursor:pointer}
.alerta{background:var(--otimo-bg);border:1px solid var(--otimo);border-radius:14px;padding:12px 16px;margin:0 0 8px;font-size:14px}
.alerta b.q{color:var(--otimo);font-size:18px}
.star{color:#e0a100;letter-spacing:1px}
.sobe{color:#c2410c;font-weight:700}.desce{color:var(--otimo);font-weight:700}
.of>svg,.tab svg,.hc svg{display:block;width:100%;height:40px}
/* cartoes de hotel */
.hc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.hc.top3{border:2px solid var(--acc)}
.hc .img{height:120px;background:linear-gradient(135deg,var(--sea1),var(--sea2));background-size:cover;background-position:center;position:relative}
.hc .img span{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.hc .img i{position:absolute;right:10px;top:10px;background:var(--acc-2);color:#fff;font-style:normal;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.hc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.hc h3{margin:0;font-size:16px;line-height:1.25}
.hc .linha{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.nb{background:var(--sea2);color:#fff;font-weight:800;font-size:13px;padding:3px 7px;border-radius:8px}
.hc .vl{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hc .vl small{font-size:13px;font-weight:400;color:var(--mut);letter-spacing:0}
.hc .go{margin-top:auto;text-align:center;font-weight:700;font-size:13px;color:#fff;background:var(--acc);text-decoration:none;border-radius:10px;padding:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chips button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--mut);padding:6px 12px;border-radius:99px;cursor:pointer}
.chips button.on{background:var(--chip);border-color:var(--acc);color:var(--acc)}
.voo{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:16px;align-items:center}
@media (max-width:640px){.voo{grid-template-columns:1fr}.hero h1{font-size:24px}.nav button{padding:9px 12px;font-size:14px}}
.opc{display:grid;gap:6px}.opc div{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px}
.opc div b{font-size:16px}
</style>
</head>
<body>
<header class="hero"><div class="in">
  <h1>🌴 Radar de Viagens</h1>
  <p id="sub">Carregando…</p>
  <nav class="nav" id="visao"><button data-v="viagens" class="on">Minhas viagens</button><button data-v="hoteis">Buscar hotéis</button><button data-v="ofertas">Passagens em promoção</button><button data-v="anac">Quando comprar</button></nav>
</div></header>
<div class="wrap">
<div class="bar" id="barra">
  <div class="seg" id="origens"></div>
  <div class="seg" id="tipo">
    <button data-v="todos" class="on">Todos</button><button data-v="nac">Nacionais</button><button data-v="int">Internacionais</button>
  </div>
  <div class="seg" id="regiao">
    <button data-v="todas" class="on">Todas as regiões</button><button data-v="NE">Nordeste</button><button data-v="SE">Sudeste</button><button data-v="S">Sul</button><button data-v="CO">Centro-Oeste</button><button data-v="N">Norte</button>
  </div>
  <input class="busca" id="cidades" type="search" list="lista-cidades" placeholder="Filtrar cidades (ex.: Recife, Maceió)" aria-label="Filtrar cidades">
  <datalist id="lista-cidades"></datalist>
  <div class="seg" id="filtro">
    <button data-v="bons" class="on">Só preço bom</button><button data-v="tudo">Tudo</button>
  </div>
</div>
<div class="resumo" id="resumo"></div>
<main id="lista"></main>
<footer id="rodape"></footer>
</div>
<script>
const $ = s => document.querySelector(s);
const st = {origem: null, tipo: "todos", filtro: "bons", visao: "viagens", regiao: "todas", cidades: ""};
const REG = {NE: "AL BA CE MA PB PE PI RN SE", SE: "ES MG RJ SP", S: "PR RS SC", CO: "DF GO MS MT", N: "AC AM AP PA RO RR TO"};
const UF_REG = {}; for (const r in REG) REG[r].split(" ").forEach(u => UF_REG[u] = r);
let UF = {};
const norm = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const termos = () => norm(st.cidades).split(",").map(t => t.trim()).filter(Boolean);
const bateCidade = (nome, cod) => { const ts = termos(); return !ts.length || ts.some(t => norm(nome).includes(t) || norm(cod) === t); };
const regiaoDe = iata => UF_REG[UF[iata]] || null;
let D = null, A = null;
const MES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const pct = v => (v >= 1 ? "+" : "−") + Math.abs(Math.round((v - 1) * 100)) + "%";

function grafSaz(saz) {
  const W = 276, mid = 30, lb = 23, mx = Math.max(.1, ...saz.filter(v => v != null).map(v => Math.abs(v - 1)));
  const min = Math.min(...saz.filter(v => v != null));
  let g = `<line class="eixo" x1="0" x2="${W}" y1="${mid}" y2="${mid}"/>`;
  saz.forEach((v, i) => {
    const x = i * lb + 3;
    if (v != null) {
      const h = Math.max(2, Math.abs(v - 1) / mx * 24), y = v >= 1 ? mid - h : mid;
      g += `<rect class="${v === min ? "bar-min" : "bar-n"}" x="${x}" y="${y}" width="17" height="${h}" rx="2"/>`;
    }
    g += `<text class="rot" x="${x + 8.5}" y="68">${MES[i][0].toUpperCase()}</text>`;
    g += `<rect class="hit" x="${x - 3}" y="0" width="${lb}" height="58"><title>${MES[i]}: ${v == null ? "sem dados" : pct(v) + " vs média do ano"}</title></rect>`;
  });
  return `<svg viewBox="0 0 ${W} 72" role="img" aria-label="Sazonalidade do preço por mês de compra">${g}</svg>`;
}

function grafHist(h) {
  const W = 276, H = 46, ps = h.map(p => p[1]), lo = Math.min(...ps), hi = Math.max(...ps), am = hi - lo || 1;
  const X = i => 4 + i * (W - 8) / Math.max(1, h.length - 1), Y = p => 6 + (1 - (p - lo) / am) * (H - 12);
  const pts = h.map((p, i) => `${X(i).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ");
  const lg = (W - 8) / h.length;
  const hits = h.map((p, i) => `<rect class="hit" x="${(X(i) - lg / 2).toFixed(1)}" y="0" width="${lg.toFixed(1)}" height="${H}"><title>${new Date(p[0] * 1000).toLocaleDateString("pt-BR")}: ${brl(p[1])}</title></rect>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Preço nos últimos dias"><polyline class="lin" points="${pts}"/><circle class="pt" cx="${X(h.length - 1)}" cy="${Y(ps[ps.length - 1])}" r="4"/>${hits}</svg>`;
}

function extras(o) {
  let x = "";
  const h = o.google && o.google.hist;
  if (h && h.length > 5) {
    const ps = h.map(p => p[1]);
    x += `<div class="extra"><span class="t">Google Flights · últimos ${h.length} dias</span>${grafHist(h)}mín <b>${brl(Math.min(...ps))}</b> · máx <b>${brl(Math.max(...ps))}</b> · agora <b>${brl(ps[ps.length - 1])}</b></div>`;
  }
  const r = A && A.rotas[o.origem + "|" + o.codigo];
  if (r && r.saz) {
    const cias = r.cias.filter(c => c.saz).slice(0, 3).map(c => `${esc(c.nome)}: <b>${MES[c.barato - 1].slice(0, 3)}</b> (${pct(c.saz[c.barato - 1])})`).join(" · ");
    x += `<div class="extra"><span class="t">Histórico ANAC · quando comprar</span>${grafSaz(r.saz)}Mais barato comprar em <b>${MES[r.barato - 1]}</b> (<b>${pct(r.saz[r.barato - 1])}</b>) · mais caro em <b>${MES[r.caro - 1]}</b> (<b>${pct(r.saz[r.caro - 1])}</b>)${cias ? "<br>" + cias : ""}</div>`;
  }
  return x;
}

function renderAnac() {
  const og = D.origens.find(x => x.id === st.origem);
  $("#resumo").innerHTML = "";
  if (!A) { $("#lista").innerHTML = `<div class="vazio">O histórico da ANAC ainda não foi carregado. Ele é baixado aos poucos nas primeiras execuções do robô.</div>`; return; }
  const rs = Object.entries(A.rotas).filter(([k]) => k.startsWith(st.origem + "|")).map(([, r]) => r).filter(r => (st.regiao === "todas" || regiaoDe(r.iata) === st.regiao) && bateCidade(r.destino, r.iata)).sort((a, b) => b.assentos12 - a.assentos12);
  const am = s => s.slice(4) + "/" + s.slice(0, 4);
  let h = `<p class="nota">Voos nacionais saindo de ${esc(og.nome)}. Tarifa média <b>por trecho</b> nos últimos 12 meses e variação típica do preço conforme o <b>mês da compra</b>, calculada sobre ${A.meses_carregados} meses de vendas (${am(A.periodo[0])} a ${am(A.periodo[1])}). Fonte: microdados de tarifas da ANAC.</p>`;
  if (!rs.length) h += `<div class="vazio">Sem rotas com volume suficiente para esta origem.</div>`;
  else {
    h += `<div class="rolar"><table class="tab"><thead><tr><th>Destino</th><th>Tarifa média</th><th>Mais barato comprar em</th><th>Mais caro</th><th>Por companhia (mês mais barato)</th></tr></thead><tbody>`;
    for (const r of rs) {
      const cias = r.cias.map(c => `${esc(c.nome)} <b>${brl(c.tarifa12)}</b>${c.saz ? ` · ${MES[c.barato - 1].slice(0, 3)} <span class="g">${pct(c.saz[c.barato - 1])}</span>` : ""}`).join("<br>");
      h += `<tr><td><b>${esc(r.destino)}</b><br>${esc(r.iata)}</td><td><b>${brl(r.tarifa12)}</b></td>` +
        (r.saz ? `<td><b>${MES[r.barato - 1]}</b> <b class="g">${pct(r.saz[r.barato - 1])}</b></td><td><b>${MES[r.caro - 1]}</b> <b class="r">${pct(r.saz[r.caro - 1])}</b></td>` : `<td colspan="2">histórico insuficiente</td>`) +
        `<td>${cias}</td></tr>`;
    }
    h += `</tbody></table></div>`;
  }
  $("#lista").innerHTML = h;
}
const brl = n => n == null ? "–" : n.toLocaleString("pt-BR", {style: "currency", currency: D.moeda || "BRL", maximumFractionDigits: 0});
const dataBR = s => s ? s.slice(8) + "/" + s.slice(5, 7) : "";
const nomeMes = ym => new Date(ym + "-15T12:00:00").toLocaleDateString("pt-BR", {month: "long", year: "numeric"});
const ROT = {otimo: "Preço ótimo", bom: "Preço bom", observacao: "Em observação", normal: "Normal"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function links(o, og) {
  const c = o.codigo, i = o.ida, v = o.volta || o.ida, yy = d => d.slice(2).replace(/-/g, "");
  const q = encodeURIComponent(`Flights from ${og.nome} to ${c} on ${i} through ${v}`);
  return [
    ["Google Flights", `https://www.google.com/travel/flights?hl=pt-BR&curr=BRL&q=${q}`],
    ["Kayak", `https://www.kayak.com.br/flights/${og.kayak}-${c}/${i}/${v}?sort=price_a`],
    ["Momondo", `https://www.momondo.com.br/flight-search/${og.kayak}-${c}/${i}/${v}?sort=price_a`],
    ["Skyscanner", `https://www.skyscanner.com.br/transport/flights/${og.skyscanner}/${c.toLowerCase()}/${yy(i)}/${yy(v)}/`],
    ["Booking", `https://flights.booking.com/flights/${og.booking}-${c}.AIRPORT/?type=ROUNDTRIP&adults=1&cabinClass=ECONOMY&depart=${i}&return=${v}&sort=CHEAPEST`]
  ].map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join("");
}

function card(o, og) {
  const pct = o.desconto != null && o.desconto > 0 ? `<span class="pct">−${Math.round(o.desconto * 100)}%</span>` : "";
  const ref = o.ref ? `Mediana da rota: <b>${brl(o.ref)}</b> (${o.dias_hist} dias)` : `Histórico: ${o.dias_hist || 0} de ${D.dias_minimos_historico} dias`;
  const g = o.google && o.google.min ? ` · Faixa típica Google: <b>${brl(o.google.min)}–${brl(o.google.max)}</b>` : "";
  const par = o.paradas == null ? "" : o.paradas === 0 ? "direto" : o.paradas + (o.paradas > 1 ? " paradas" : " parada");
  return `<article class="of ${o.nivel}">
    <div class="top"><div class="dest">${esc(o.destino)} <small>${esc(o.codigo)} · ${esc(o.pais)}</small></div><span class="tag ${o.nivel}">${ROT[o.nivel]}</span></div>
    <div class="nums"><span class="preco">${brl(o.preco)}</span>${pct}</div>
    <div class="meta"><b>${dataBR(o.ida)} → ${dataBR(o.volta)}</b> · ${esc(o.cia)}${par ? " · " + par : ""}<br>${ref}${g}<br>${esc(o.motivo)}</div>
    ${extras(o)}<div class="links">${links(o, og)}</div></article>`;
}


let V = null;
const REPO = (() => { const h = location.hostname.split(".")[0], p = location.pathname.split("/")[1]; return location.hostname.endsWith("github.io") && p ? h + "/" + p : "henriquesimoessilva3-png/radar-passagens"; })();
const issueLink = (titulo, obj) => `https://github.com/${REPO}/issues/new?title=${encodeURIComponent("Monitorar: " + titulo)}&body=${encodeURIComponent("Gerado pelo painel do Radar.\n\n```json\n" + JSON.stringify(obj, null, 2) + "\n```")}`;
const spark = hist => {
  const ds = Object.keys(hist || {}).sort(); if (ds.length < 2) return "";
  const W = 276, H = 40, ps = ds.map(d => hist[d]), lo = Math.min(...ps), hi = Math.max(...ps), am = hi - lo || 1;
  const X = i => 4 + i * (W - 8) / (ds.length - 1), Y = p => 5 + (1 - (p - lo) / am) * (H - 10);
  const hits = ds.map((d, i) => `<rect class="hit" x="${(X(i) - 4).toFixed(1)}" y="0" width="8" height="${H}"><title>${dataBR(d)}: ${brl(hist[d])}</title></rect>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Preço por dia"><polyline class="lin" points="${ds.map((d, i) => X(i).toFixed(1) + "," + Y(hist[d]).toFixed(1)).join(" ")}"/><circle class="pt" cx="${X(ds.length - 1)}" cy="${Y(ps[ps.length - 1])}" r="4"/>${hits}</svg>`;
};
const ultimo = h => { const ds = Object.keys(h || {}).sort(); return ds.length ? h[ds[ds.length - 1]] : null; };
const minimo = h => { const v = Object.values(h || {}); return v.length ? Math.min(...v) : null; };
const primeiro = h => { const ds = Object.keys(h || {}).sort(); return ds.length ? h[ds[0]] : null; };
const varPct = (a, b) => !a || !b ? "" : (b < a ? `<span class="desce">−${Math.round((1 - b / a) * 100)}%</span>` : b > a ? `<span class="sobe">+${Math.round((b / a - 1) * 100)}%</span>` : "=");

function linksHotel(f) {
  const d = encodeURIComponent(f.destino), ci = f.checkin, co = f.checkout, ad = f.adultos;
  const nf = [];
  if (f.ai) nf.push("mealplan=4");
  (f.estrelas || []).forEach(e => nf.push("class=" + e));
  if (f.nota) nf.push("review_score=" + ({"4": 70, "4.3": 80, "4.5": 90}[f.nota] || 80));
  if (f.praia) nf.push("ht_beach=1");
  const exp = dom => `https://www.${dom}/Hotel-Search?destination=${d}&startDate=${ci}&endDate=${co}&adults=${ad}&rooms=1${f.ai ? "&mealPlan=ALL_INCLUSIVE" : ""}&sort=PRICE_LOW_TO_HIGH`;
  return [
    ["Booking", `https://www.booking.com/searchresults.pt-br.html?ss=${d}&checkin=${ci}&checkout=${co}&group_adults=${ad}&no_rooms=1&group_children=0&selected_currency=BRL&order=price&nflt=${encodeURIComponent(nf.join(";"))}`],
    ["Google Hotéis", `https://www.google.com/travel/search?q=${encodeURIComponent((f.ai ? "all inclusive " : "") + f.destino)}&hl=pt-BR&curr=BRL`],
    ["Hoteis.com", exp("hoteis.com")],
    ["Expedia", exp("expedia.com.br")],
    ["Decolar", `https://www.decolar.com/hoteis/?q=${d}`],
    ["Kayak", `https://www.kayak.com.br/hotels/${d}/${ci}/${co}/${ad}adults?sort=price_a`]
  ].map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join("");
}

function lerForm(id) {
  const f = {}; document.querySelectorAll(id + " [name]").forEach(e => f[e.name] = e.type === "checkbox" ? e.checked : e.value);
  return f;
}

const hst = {teto: false, ordem: "preco", so5: false, adultos: false};
const noites = v => Math.round((new Date(v.checkout) - new Date(v.checkin)) / 864e5) || 1;

function renderHoteis() {
  $("#resumo").innerHTML = "";
  const hoje = new Date(), d1 = new Date(hoje.getTime() + 30 * 864e5), d2 = new Date(d1.getTime() + 7 * 864e5), iso = x => x.toISOString().slice(0, 10);
  $("#lista").innerHTML = `<h2>Buscar hotéis <small>no Brasil ou fora</small></h2><p class="sub">Preencha uma vez e abra a mesma busca, com os mesmos filtros, em vários sites. Para o robô acompanhar o preço todo dia, clique em <b>Monitorar esta busca</b>.</p>
  <div class="form" id="fh">
    <label class="full">Destino<input name="destino" value="Zona Hotelera, Cancún" placeholder="Cidade, bairro ou região (ex.: Porto de Galinhas, Maragogi, Punta Cana)"></label>
    <label>Check-in<input type="date" name="checkin" value="${iso(d1)}"></label>
    <label>Check-out<input type="date" name="checkout" value="${iso(d2)}"></label>
    <label>Adultos<input type="number" min="1" max="8" name="adultos" value="2"></label>
    <label>Nota mínima<select name="nota"><option value="4">Booking 7+ (Google 4,0+)</option><option value="4.3" selected>Booking 8+ (Google 4,3+)</option><option value="4.5">Booking 9+ (Google 4,5+)</option></select></label>
    <label class="chk"><input type="checkbox" name="e4" checked>4 estrelas</label>
    <label class="chk"><input type="checkbox" name="e5" checked>5 estrelas</label>
    <label class="chk"><input type="checkbox" name="ai" checked>All inclusive</label>
    <label class="chk"><input type="checkbox" name="praia" checked>Beira-mar</label>
    <div class="full links" id="lh"></div>
    <div class="full"><a class="btn" id="mh" target="_blank" rel="noopener">🔔 Monitorar esta busca</a></div>
  </div>`;
  const upd = () => {
    const f = lerForm("#fh"); f.estrelas = [f.e4 && 4, f.e5 && 5].filter(Boolean);
    $("#lh").innerHTML = linksHotel(f);
    $("#mh").href = issueLink(f.destino + " " + f.checkin, {tipo: "hotel", nome: `${f.destino} (${dataBR(f.checkin)}–${dataBR(f.checkout)})`, q: (f.ai ? "resorts all inclusive " : "hotéis ") + f.destino,
      checkin: f.checkin, checkout: f.checkout, adultos: +f.adultos, estrelas: f.estrelas, nota_min: +f.nota, all_inclusive: f.ai, beira_mar: f.praia, queda_alerta: 0.05});
  };
  $("#fh").addEventListener("input", upd); upd();
}

function cardHotel(x, n, top) {
  const nota = x.nota_booking != null ? `<span class="nb" title="Nota Booking">${Number(x.nota_booking).toFixed(1).replace(".", ",")}</span>` : x.nota_google != null ? `<span class="nb" title="Nota Google">${String(x.nota_google).replace(".", ",")}/5</span>` : "";
  const img = x.foto ? ` style="background-image:url('${esc(x.foto)}')"` : "";
  return `<article class="hc ${top ? "top3" : ""}"><div class="img"${img}>${x.regiao ? `<span>${esc(x.regiao)}</span>` : ""}${x.oferta ? `<i>${esc(x.oferta)}</i>` : ""}</div>
    <div class="bd"><h3>${esc(x.n)}</h3>
    <div class="linha"><span class="star">${"★".repeat(x.estrelas || 0)}</span>${nota}</div>
    <div class="vl">${brl(x.hoje)} <small>${n} noites · ${brl(Math.round(x.hoje / n))}/noite</small></div>
    <div class="linha"><span>Menor já visto: <b>${brl(x.min)}</b></span><span>${varPct(x.ini, x.hoje)}</span></div>
    ${spark(x.hist)}
    ${x.link ? `<a class="go" href="${esc(x.link)}" target="_blank" rel="noopener">Ver disponibilidade</a>` : ""}</div></article>`;
}

function renderViagens() {
  const vs = ((V && V.viagens) || []).filter(v => v.ativo !== false), it = (V && V.itens) || {};
  const al = (V && V.alertas) || [];
  const voo = vs.find(v => v.tipo === "voo"), vi = voo && it[voo.id];
  const menorVoo = vi ? ultimo(vi.hist) : null;
  let menorHotel = null;
  vs.filter(v => v.tipo === "hotel").forEach(v => Object.values((it[v.id] || {}).hoteis || {}).forEach(x => { const p = ultimo(x.hist); if (p && (!menorHotel || p < menorHotel)) menorHotel = p; }));
  $("#resumo").innerHTML = `<div class="kpi"><b>${brl(menorVoo)}</b><span>voo mais barato · ${voo ? esc(voo.origem + " → " + voo.destino) : "–"} (${voo ? voo.adultos || 1 : ""} adultos)</span></div>
    <div class="kpi"><b>${brl(menorHotel)}</b><span>hotel all inclusive mais barato · 7 noites</span></div>
    <div class="kpi"><b>${menorVoo && menorHotel ? brl(menorVoo + menorHotel) : "–"}</b><span>viagem completa (voo + hotel)</span></div>
    <div class="kpi"><b>${al.length}</b><span>alertas de queda nos últimos 30 dias</span></div>`;
  let h = al.slice(0, 6).map(a => `<div class="alerta">🔔 <b>${esc(a.item)}</b> ${esc(a.extra || "")} · ${esc(a.viagem)}: ${brl(a.de)} → <b>${brl(a.para)}</b> <b class="q">−${Math.round(a.queda * 100)}%</b> <span class="meta">(${dataBR(a.dia)})</span></div>`).join("");
  if (!vs.length) h += `<div class="vazio">Nenhuma viagem monitorada ainda. Use a aba <b>Buscar hotéis</b> ou o formulário no fim desta página.</div>`;
  for (const v of vs) {
    const i = it[v.id] || {};
    const fonte = i.fonte ? ` · fonte: ${esc(i.fonte)}` : i.atualizado ? ` · atualizado em ${dataBR(i.atualizado)}` : "";
    if (v.tipo === "voo") {
      const nome = o => o.paradas ? o.paradas + (o.paradas > 1 ? " paradas" : " parada") : "direto";
      const op = (i.opcoes || []).slice(0, 4).map(o => `<div><span>${esc(o.cias.join(" + "))} · ${nome(o)}${o.duracao ? " · " + Math.floor(o.duracao / 60) + "h" + String(o.duracao % 60).padStart(2, "0") : ""}</span><b>${brl(o.preco)}</b></div>`).join("");
      const g = i.google ? `Google: <b>${{low: "preço baixo", typical: "preço típico", high: "preço alto"}[i.google.nivel] || i.google.nivel}</b>${i.google.faixa ? ` (faixa ${brl(i.google.faixa[0])}–${brl(i.google.faixa[1])})` : ""}` : "";
      h += `<h2>✈️ ${esc(v.nome)}</h2><p class="sub">${esc(v.origem)} → ${esc(v.destino)} · ${dataBR(v.ida)} a ${dataBR(v.volta)} · ${v.adultos || 1} adultos, ida e volta${fonte}</p>
        <div class="of voo"><div><div class="meta">Menor preço hoje</div><div class="preco">${brl(ultimo(i.hist))}</div><div class="meta">Menor já visto: <b>${brl(minimo(i.hist))}</b> ${varPct(primeiro(i.hist), ultimo(i.hist))}<br>${g}</div>${spark(i.hist)}
        <div class="links" style="margin-top:8px"><a target="_blank" rel="noopener" href="https://www.google.com/travel/flights?hl=pt-BR&curr=BRL&q=${encodeURIComponent(`Flights from ${v.origem} to ${v.destino} on ${v.ida} through ${v.volta} for ${v.adultos || 1} adults`)}">Google Voos</a><a target="_blank" rel="noopener" href="https://www.kayak.com.br/flights/${v.origem}-${v.destino}/${v.ida}/${v.volta}/${v.adultos || 1}adults?sort=price_a">Kayak</a><a target="_blank" rel="noopener" href="https://www.decolar.com/shop/flights/results/roundtrip/${v.origem}/${v.destino}/${v.ida}/${v.volta}/${v.adultos || 1}/0/0">Decolar</a></div></div>
        <div class="opc">${op || '<div class="meta">Aguardando a primeira busca do robô.</div>'}</div></div>`;
    } else {
      const n = noites(v);
      let hs = Object.entries(i.hoteis || {}).map(([nm, x]) => ({n: nm, ...x, hoje: ultimo(x.hist), min: minimo(x.hist), ini: primeiro(x.hist), adulto: /adult|só adultos/i.test(nm + " " + (x.regiao || ""))})).filter(x => x.hoje);
      const total = hs.length;
      if (hst.teto) hs = hs.filter(x => x.hoje <= 14000);
      if (hst.so5) hs = hs.filter(x => x.estrelas === 5);
      if (hst.adultos) hs = hs.filter(x => x.adulto);
      hs.sort(hst.ordem === "nota" ? (a, b) => ((b.nota_booking || b.nota_google * 2 || 0) - (a.nota_booking || a.nota_google * 2 || 0)) || a.hoje - b.hoje : (a, b) => a.hoje - b.hoje);
      const f = {destino: v.q.replace(/^(resorts |hotéis )?(all inclusive )?/i, ""), checkin: v.checkin, checkout: v.checkout, adultos: v.adultos || 2, estrelas: v.estrelas, nota: String(v.nota_min || ""), ai: v.all_inclusive, praia: v.beira_mar};
      h += `<h2>🏝️ ${esc(v.nome)}</h2><p class="sub">${dataBR(v.checkin)} a ${dataBR(v.checkout)} · ${n} noites · ${v.adultos || 2} adultos · preço total da estadia com impostos · ${hs.length} de ${total} hotéis${fonte}</p>
        <div class="chips" data-v="${esc(v.id)}"><button data-k="teto" class="${hst.teto ? "on" : ""}">Até R$ 14 mil</button><button data-k="so5" class="${hst.so5 ? "on" : ""}">Só 5 estrelas</button><button data-k="adultos" class="${hst.adultos ? "on" : ""}">Só adultos</button><button data-k="ordem" class="${hst.ordem === "nota" ? "on" : ""}">${hst.ordem === "nota" ? "Ordenado por nota" : "Ordenado por preço"}</button></div>`;
      h += hs.length ? `<div class="grid">${hs.map((x, k) => cardHotel(x, n, k < 3 && hst.ordem === "preco" && !hst.teto ? false : false)).join("")}</div>` : `<div class="vazio">${total ? "Nenhum hotel com esses filtros." : "Aguardando a primeira busca do robô."}</div>`;
      h += `<div class="links" style="margin-top:12px">${linksHotel(f)}</div>`;
    }
  }
  h += `<h2>➕ Monitorar outro voo</h2><p class="sub">Para hotéis, use a aba <b>Buscar hotéis</b>.</p><div class="form" id="fv">
    <label>Origem (código)<input name="origem" value="CNF"></label><label>Destino (código)<input name="destino" placeholder="ex.: CUN, REC, LIS"></label>
    <label>Ida<input type="date" name="ida"></label><label>Volta<input type="date" name="volta"></label><label>Adultos<input type="number" min="1" max="8" name="adultos" value="2"></label>
    <div class="full"><a class="btn" id="mv" target="_blank" rel="noopener">🔔 Monitorar este voo</a></div></div>`;
  $("#lista").innerHTML = h;
  document.querySelectorAll(".chips").forEach(c => c.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const k = b.dataset.k; if (k === "ordem") hst.ordem = hst.ordem === "nota" ? "preco" : "nota"; else hst[k] = !hst[k];
    renderViagens();
  }));
  const upd = () => { const f = lerForm("#fv"); $("#mv").href = issueLink(`${f.origem}-${f.destino} ${f.ida}`, {tipo: "voo", nome: `${f.origem.toUpperCase()} → ${f.destino.toUpperCase()} (${dataBR(f.ida)}–${dataBR(f.volta)})`, origem: f.origem.toUpperCase(), destino: f.destino.toUpperCase(), ida: f.ida, volta: f.volta, adultos: +f.adultos, queda_alerta: 0.05}); };
  $("#fv").addEventListener("input", upd); upd();
}

function opcoes() {
  const nomes = new Set(D.ofertas.filter(o => o.origem === st.origem).map(o => o.destino));
  if (A) Object.entries(A.rotas).forEach(([k, r]) => { if (k.startsWith(st.origem + "|")) nomes.add(r.destino); });
  $("#lista-cidades").innerHTML = [...nomes].sort((a, b) => a.localeCompare(b, "pt-BR")).map(n => `<option value="${esc(n)}">`).join("");
}

function render() {
  const anac = st.visao === "anac", extra = st.visao === "viagens" || st.visao === "hoteis";
  opcoes();
  $("#tipo").style.display = $("#filtro").style.display = anac || extra ? "none" : "";
  $("#regiao").style.display = extra || (!anac && st.tipo === "int") ? "none" : "";
  $("#barra").style.display = extra ? "none" : "";
  try { history.replaceState(null, "", "#" + st.visao); } catch (e) {}
  if (st.visao === "viagens") return renderViagens();
  if (st.visao === "hoteis") return renderHoteis();
  if (anac) return renderAnac();
  const og = D.origens.find(x => x.id === st.origem);
  let ofs = D.ofertas.filter(o => o.origem === st.origem);
  if (st.tipo === "nac") ofs = ofs.filter(o => o.nacional);
  if (st.tipo === "int") ofs = ofs.filter(o => !o.nacional);
  else if (st.regiao !== "todas") ofs = ofs.filter(o => o.nacional && regiaoDe(o.codigo) === st.regiao);
  ofs = ofs.filter(o => bateCidade(o.destino, o.codigo));
  const bons = ofs.filter(o => o.nivel === "bom" || o.nivel === "otimo");
  const menor = ofs.reduce((m, o) => !m || o.preco < m.preco ? o : m, null);
  const top = bons.reduce((m, o) => !m || (o.desconto || 0) > (m.desconto || 0) ? o : m, null);
  $("#resumo").innerHTML = `
    <div class="kpi"><b>${bons.length}</b><span>passagens com preço bom</span></div>
    <div class="kpi"><b>${ofs.length}</b><span>ofertas monitoradas</span></div>
    <div class="kpi"><b>${menor ? brl(menor.preco) : "–"}</b><span>menor preço${menor ? " · " + esc(menor.destino) : ""}</span></div>
    <div class="kpi"><b>${top && top.desconto ? "−" + Math.round(top.desconto * 100) + "%" : "–"}</b><span>maior desconto${top && top.desconto ? " · " + esc(top.destino) : ""}</span></div>`;
  const mostra = st.filtro === "bons" ? bons : ofs;
  const meses = [...new Set(ofs.map(o => o.ida.slice(0, 7)))].sort();
  const ord = {otimo: 0, bom: 1, observacao: 2, normal: 3};
  let html = "";
  for (const m of meses) {
    const doMes = mostra.filter(o => o.ida.startsWith(m)).sort((a, b) => ord[a.nivel] - ord[b.nivel] || (b.desconto || 0) - (a.desconto || 0) || a.preco - b.preco);
    html += `<h2>${nomeMes(m)} <small>${doMes.length} ${st.filtro === "bons" ? "com preço bom" : "ofertas"}</small></h2>`;
    html += doMes.length ? `<div class="grid">${doMes.map(o => card(o, og)).join("")}</div>`
      : `<div class="vazio">Nenhuma passagem com preço bom neste mês por enquanto.</div>`;
  }
  if (!meses.length) html = `<div class="vazio">Ainda não há dados para ${esc(og.nome)}. As origens secundárias entram em rodízio — aparecem nos primeiros dias de execução.</div>`;
  else if (st.filtro === "bons" && !bons.length && ofs.some(o => o.nivel === "observacao"))
    html = `<div class="vazio">O radar ainda está formando o histórico (precisa de ${D.dias_minimos_historico} dias por rota para dizer o que é barato). Clique em <b>Tudo</b> para ver os preços já coletados.</div>` + html;
  $("#lista").innerHTML = html;
}

function seg(id, chave) {
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    st[chave] = b.dataset.v;
    [...$(id).children].forEach(x => x.classList.toggle("on", x === b));
    render();
  });
}

const pega = u => fetch(u + "?t=" + Date.now()).then(r => { if (!r.ok) throw 0; return r.json(); });
Promise.all([pega("data/deals.json"), pega("data/anac.json").catch(() => null), pega("aeroportos_br.json").catch(() => ({})), pega("data/viagens.json").catch(() => null)]).then(([d, a, ap, v]) => {
  D = d; A = a; V = v;
  const hv = location.hash.slice(1); if (["ofertas", "viagens", "hoteis", "anac"].includes(hv)) { st.visao = hv; [...$("#visao").children].forEach(x => x.classList.toggle("on", x.dataset.v === hv)); }
  Object.values(ap).forEach(v => UF[v[0]] = v[2]);
  st.origem = (d.origens.find(o => o.principal) || d.origens[0]).id;
  $("#origens").innerHTML = d.origens.map(o => `<button data-v="${o.id}" class="${o.id === st.origem ? "on" : ""}">${esc(o.nome)}</button>`).join("");
  $("#sub").textContent = `Voos e hotéis monitorados todo dia · passagens atualizadas em ${d.atualizado.slice(8, 10)}/${d.atualizado.slice(5, 7)} às ${d.atualizado.slice(11)}`;
  $("#rodape").innerHTML = `Histórico ANAC: só voos nacionais; mostra em que meses a passagem costuma ser <b>vendida</b> mais barata (mês da compra, não da viagem). “Preço bom” = pelo menos 15% abaixo da mediana do histórico da rota, ou classificado como baixo pelo Google Flights. Buscas usadas no mês: <b>${d.buscas_no_mes}</b> de ${d.limite_mensal}. Confira sempre o preço final no site antes de comprar.`;
  seg("#visao", "visao"); seg("#origens", "origem"); seg("#tipo", "tipo"); seg("#regiao", "regiao");
  try { st.cidades = localStorage.getItem("radar-cidades") || ""; } catch (e) {}
  $("#cidades").value = st.cidades;
  $("#cidades").addEventListener("input", e => { st.cidades = e.target.value; try { localStorage.setItem("radar-cidades", st.cidades); } catch (e2) {} render(); }); seg("#filtro", "filtro");
  window.addEventListener("hashchange", () => { const hv = location.hash.slice(1); if (hv !== st.visao && ["ofertas", "viagens", "hoteis", "anac"].includes(hv)) { st.visao = hv; [...$("#visao").children].forEach(x => x.classList.toggle("on", x.dataset.v === hv)); render(); } });
  render();
}).catch(() => { $("#sub").textContent = "Ainda sem dados — rode o robô uma vez (aba Actions no GitHub)."; });
</script>
</body>
</html>
