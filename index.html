<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de Viagens</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#23213a; --tinta-2:#5b5873; --papel:#ffffff; --ceu:#e9f6ff; --mar:#00a3a3; --mar-esc:#007f86; --sol:#ffc22e; --coral:#ff6b4a; --linha:#dcdfee;
  --bg:#f5fbff; --card:#fff; --ink:var(--tinta); --mut:var(--tinta-2); --line:var(--linha); --acc:var(--mar-esc); --chip:#e6f7f6;
  --otimo:#0f9d58; --otimo-bg:#e3f7ec; --bom:#4d8f12; --bom-bg:#ecf7dd; --obs:#9a6b00; --obs-bg:#fff2cc; --norm:#5b5873; --norm-bg:#eef0f7;
  --disp:"Unbounded",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tinta);font:15px/1.5 Arial,Helvetica,sans-serif}
a{color:var(--mar-esc)}
:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- topo: a viagem como rota ---------- */
.hero{background:var(--mar);color:#fff;position:relative;overflow:hidden}
.hero .in{max-width:1160px;margin:0 auto;padding:18px 20px 0;position:relative;z-index:2}
.hero .marca{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.hero h1{margin:0;font:700 17px/1 var(--disp);letter-spacing:.01em}
.hero h1 span{color:var(--sol)}
#sub{margin:6px 0 0;font-size:12.5px;opacity:.85}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-right:120px}
.nav button{border:0;background:none;color:#fff;font:700 14px/1 Arial,sans-serif;padding:10px 14px 12px;cursor:pointer;border-bottom:4px solid transparent;opacity:.85}
.nav button:hover{opacity:1}
.nav button.on{border-bottom-color:var(--sol);opacity:1}
.rota{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:14px;padding:26px 0 50px}
.rota .cod{font:900 clamp(44px,9vw,104px)/.9 var(--disp);letter-spacing:-.03em}
.rota .cod small{display:block;font:700 13px/1.3 Arial,sans-serif;letter-spacing:0;opacity:.85;margin-top:8px}
.rota .cod.dir{text-align:right}
.rota svg{width:100%;height:110px;overflow:visible;align-self:center}
.rota .arco{fill:none;stroke:#fff;stroke-width:2.5;stroke-dasharray:2 9;stroke-linecap:round;opacity:.9}
.rota .aviao{fill:var(--sol)}
.conta{text-align:center;margin:-40px 0 0;padding-bottom:74px}
.conta b{display:block;font:900 clamp(22px,3.2vw,34px)/1 var(--disp)}
.conta span{font-size:13px;opacity:.9}
.sol{position:absolute;right:-70px;top:-90px;width:210px;height:210px;border-radius:50%;background:var(--sol);opacity:.95;z-index:1}
.ondas{position:absolute;left:0;bottom:-1px;width:100%;height:46px;z-index:3;display:block}
.hero.curto .rota{display:none}
.hero.curto .in{padding-bottom:54px}

/* ---------- base ---------- */
.wrap{max-width:1160px;margin:0 auto;padding:26px 20px 80px}
h2{font:700 21px/1.25 var(--disp);margin:34px 0 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;color:var(--tinta)}
h2 small{font:400 13px/1.4 Arial,sans-serif;color:var(--tinta-2)}
.sub,.nota{color:var(--tinta-2);font-size:13.5px;margin:0 0 14px}
.meta{color:var(--tinta-2);font-size:13px}
.vazio{border:2px dashed var(--linha);border-radius:22px;padding:26px;color:var(--tinta-2);text-align:center;background:#fff}
footer{margin-top:40px;color:var(--tinta-2);font-size:12px}
.star{color:#f0a500;letter-spacing:1px}
.sobe{color:#c2410c;font-weight:700}.desce{color:var(--otimo);font-weight:700}

/* números: sem caixas, só tipografia grande separada por fio vertical */
.resumo{display:flex;flex-wrap:wrap;gap:0;margin:0 0 10px}
.kpi{padding:6px 28px 6px 0;margin-right:28px;border-right:2px solid var(--linha);min-width:150px}
.kpi:last-child{border-right:0}
.kpi b{display:block;font:900 30px/1.1 var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--tinta-2);font-size:12.5px}
.kpi-l{display:flex;flex-wrap:wrap;margin:10px 0 16px}

/* filtros e controles */
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:#fff;border:2px solid var(--linha);border-radius:99px;padding:4px}
.seg button{border:0;background:none;color:var(--tinta-2);font:700 13.5px/1 Arial,sans-serif;padding:9px 14px;border-radius:99px;cursor:pointer}
.seg button.on{background:var(--tinta);color:#fff}
.busca{flex:1 1 220px;min-width:200px;font:inherit;color:var(--tinta);background:#fff;border:2px solid var(--linha);border-radius:99px;padding:10px 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px}
.chips button{font:700 13px/1 Arial,sans-serif;border:2px solid var(--linha);background:#fff;color:var(--tinta-2);padding:9px 14px;border-radius:99px;cursor:pointer}
.chips button.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:13px;font-weight:700;color:var(--tinta);text-decoration:none;border:2px solid var(--linha);border-radius:99px;padding:6px 12px;background:#fff}
.links a:hover{border-color:var(--mar)}
.btn{display:inline-flex;align-items:center;gap:8px;font:700 15px/1 Arial,sans-serif;color:#fff;background:var(--coral);border:0;border-radius:99px;padding:13px 22px;text-decoration:none;cursor:pointer;box-shadow:0 6px 0 #d9472a}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #d9472a}
.btn.grande{font-size:17px;padding:17px 30px}
.tag{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.tag.otimo{background:var(--otimo-bg);color:var(--otimo)}.tag.bom{background:var(--bom-bg);color:var(--bom)}.tag.observacao{background:var(--obs-bg);color:var(--obs)}.tag.normal{background:var(--norm-bg);color:var(--norm)}
.alerta{background:#fff;border-left:6px solid var(--otimo);border-radius:12px;padding:12px 16px;margin:0 0 8px;font-size:14px}
.alerta b.q{color:var(--otimo);font:900 18px var(--disp)}

/* ---------- cartão de embarque ---------- */
.of,.rc:not(.hotel),.bp{--furo:var(--bg);position:relative;background:#fff;border-radius:22px;box-shadow:0 1px 0 rgba(35,33,58,.06),0 14px 28px -20px rgba(35,33,58,.45)}
.of{padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.rc{display:flex;gap:14px;justify-content:space-between;align-items:center;padding:16px 18px;margin-bottom:12px}
.rc:not(.hotel){padding:0;align-items:stretch}
.rc:not(.hotel)>div:first-child{flex:1;padding:16px 20px;min-width:0}
.rc:not(.hotel) .rp{position:relative;padding:16px 20px;border-left:2px dashed var(--linha);background:var(--ceu);min-width:150px;border-radius:0 22px 22px 0}
.rc:not(.hotel) .rp:before,.rc:not(.hotel) .rp:after{content:"";position:absolute;left:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.rc:not(.hotel) .rp:before{top:-11px}.rc:not(.hotel) .rp:after{bottom:-11px}
.rc .rt{font:700 15px/1.3 Arial,sans-serif}
.rc .horas{font:900 22px/1.15 var(--disp);letter-spacing:-.02em;margin-bottom:4px}
.rc .horas i{font-style:normal;color:var(--mar);margin:0 8px;font-size:16px}
.rc .rp{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.rc .rp b{font:900 24px/1.1 var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rc .rp a{font-size:12.5px;font-weight:700}
.rc.melhor{outline:3px solid var(--sol);outline-offset:-3px}
.rc.melhor:after{content:"mais barato";position:absolute;left:18px;top:-11px;background:var(--sol);color:var(--tinta);font:700 11px/1 Arial,sans-serif;padding:5px 9px;border-radius:99px}
.rc.hotel.melhor:after{left:auto;right:18px}
.src{font-size:11px;font-weight:700;color:var(--mar-esc);background:#fff;border:1.5px solid #bfe9e7;border-radius:99px;padding:2px 8px}

/* ---------- cartão-postal (hotéis) ---------- */
.rc.hotel{position:relative;background:#fff;border-radius:6px;padding:12px;align-items:stretch;box-shadow:0 1px 0 rgba(35,33,58,.06),0 16px 30px -22px rgba(35,33,58,.55);transform:rotate(-.25deg)}
.rc.hotel:nth-child(even){transform:rotate(.3deg)}
.rc .ft{width:150px;min-height:120px;flex:none;border-radius:3px;background:linear-gradient(180deg,#8fd9ff 0 55%,#00a3a3 55% 75%,#ffe1a6 75%);background-size:cover;background-position:center}
.rc .hm{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding:2px 4px}
.rc.hotel .rt{font:700 16px/1.25 var(--disp)}
.rc.hotel .rp{min-width:130px;padding-left:12px;border-left:1.5px solid var(--linha)}
.notas{display:flex;justify-content:flex-end;gap:6px;margin-bottom:4px}
.nb,.ng{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;font:900 13px/1 var(--disp);color:var(--tinta);background:var(--sol);outline:2px dashed var(--sol);outline-offset:2px;transform:rotate(-8deg)}
.ng{background:#fff;color:#1a73e8;outline-color:#1a73e8;border:2px solid #1a73e8;font-size:11.5px;transform:rotate(6deg)}
.ng small{display:block;font:700 7.5px/1 Arial,sans-serif;margin-bottom:1px}
.nb,.ng{line-height:1}
.ng{display:inline-flex;flex-direction:column;align-items:center;justify-content:center}
.ng.off{color:var(--tinta-2);border-color:var(--linha);outline-color:var(--linha)}
.go2{background:var(--coral);color:#fff!important;text-decoration:none;border-radius:99px;padding:7px 14px;margin-top:4px;font-size:13px}

/* postais grandes em Minhas viagens */
.lh{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.hc{background:#fff;border-radius:6px;padding:12px 12px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 rgba(35,33,58,.06),0 18px 34px -24px rgba(35,33,58,.6);position:relative}
.hc:nth-child(3n+1){transform:rotate(-.6deg)}.hc:nth-child(3n+2){transform:rotate(.4deg)}
.hc .img{height:190px;border-radius:3px;background:linear-gradient(180deg,#8fd9ff 0 55%,#00a3a3 55% 75%,#ffe1a6 75%);background-size:cover;background-position:center;position:relative}
.hc .img i{position:absolute;left:10px;bottom:10px;background:var(--coral);color:#fff;font:700 12px/1 Arial,sans-serif;font-style:normal;padding:6px 10px;border-radius:99px}
.hc .mid{display:flex;flex-direction:column;gap:6px;padding:0 4px}
.hc h3{margin:0;font:700 17px/1.25 var(--disp);color:var(--tinta)}
.hc h3 .star{font-family:Arial,sans-serif}
.hc .loc{font-size:13px;color:var(--mar-esc);font-weight:700;text-decoration:none}
.hc .tg{display:flex;flex-wrap:wrap;gap:6px}
.hc .tg span{font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--chip);color:var(--mar-esc)}
.hc .tg span.az{background:var(--norm-bg);color:var(--tinta-2)}
.hc .dir{display:flex;flex-direction:column;gap:4px;padding:10px 4px 0;border-top:1.5px dashed var(--linha)}
.hc .sc{position:absolute;right:14px;top:14px;display:flex;align-items:center;gap:6px}
.hc .sc div{display:none}
.hc .vl{font:900 30px/1 var(--disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hc .pn{font-size:12.5px;color:var(--tinta-2)}
.hc .go{display:block;text-align:center;font-weight:700;font-size:14px;color:#fff;background:var(--tinta);text-decoration:none;border-radius:99px;padding:11px;margin-top:6px}
.hc .go:hover{background:var(--mar-esc)}
.hc svg,.of>svg{display:block;width:100%;height:40px}
.lin{fill:none;stroke:var(--mar);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.pt{fill:var(--coral);stroke:#fff;stroke-width:2}
.rot{font-size:9px;fill:var(--tinta-2);text-anchor:middle}.hit{fill:transparent}.hit:hover{fill:var(--tinta);fill-opacity:.06}
.bar-n{fill:var(--norm)}.bar-min{fill:var(--mar)}.eixo{stroke:var(--linha);stroke-width:1}

/* voo monitorado = cartão de embarque grande */
.of.voo{display:grid;grid-template-columns:1.1fr 1.4fr;gap:0;padding:0;overflow:hidden}
.of.voo>div:first-child{padding:20px 22px;background:var(--ceu);border-right:2px dashed var(--linha);position:relative}
.of.voo .preco{font:900 40px/1 var(--disp);letter-spacing:-.03em;margin:4px 0}
.opc{display:grid;gap:0;padding:12px 18px;align-content:start}
.opc div{display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1.5px dashed var(--linha);font-size:13.5px}
.opc div:last-child{border-bottom:0}
.opc div b{font:900 17px/1.2 var(--disp)}

/* ofertas (Passagens em promoção) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dest{font:700 17px/1.25 var(--disp)}
.dest small{display:block;font:400 12.5px/1.4 Arial,sans-serif;color:var(--tinta-2);margin-top:3px}
.nums{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.preco{font:900 28px/1.1 var(--disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pct{font:900 20px var(--disp);color:var(--otimo)}
.extra{border-top:1.5px dashed var(--linha);padding-top:8px;font-size:12.5px;color:var(--tinta-2)}
.extra b{color:var(--tinta);font-size:14px}
.extra svg{display:block;width:100%;height:auto;margin:4px 0 2px}
.extra .t{font-weight:700;color:var(--tinta);font-size:12px}
.tab{width:100%;border-collapse:collapse;background:#fff;border-radius:18px;overflow:hidden;font-size:13px}
.tab th{text-align:left;font-size:12px;color:var(--tinta-2);padding:10px 12px;border-bottom:2px solid var(--linha)}
.tab td{padding:10px 12px;border-bottom:1px solid var(--linha);vertical-align:top}
.tab td b{font-size:16px}.tab .g{color:var(--otimo)}.tab .r{color:var(--tinta-2)}
.tab svg{display:block;width:100%;height:40px}
.rolar{overflow-x:auto}

/* ---------- busca = bilhete ---------- */
.modo{margin:0 0 18px}
.form{background:#fff;border-radius:28px;padding:22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:end;margin-bottom:16px;box-shadow:0 1px 0 rgba(35,33,58,.06),0 22px 40px -28px rgba(35,33,58,.6)}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--tinta-2);font-weight:700}
.form>*,.form label{min-width:0}
.form input,.form select{min-width:0;width:100%;font:inherit;font-size:15px;color:var(--tinta);background:var(--bg);border:2px solid transparent;border-radius:14px;padding:11px 12px}
.form input:focus,.form select:focus{border-color:var(--mar);outline:0;background:#fff}
.form .chk{flex-direction:row;align-items:center;gap:7px;color:var(--tinta);font-size:13.5px}
.form .chk input{width:auto}
.form .full{grid-column:1/-1}
.form .dois{grid-column:span 2}
.prefs{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-size:13px;padding-top:4px}
.prefs b{font-size:12px;color:var(--tinta-2)}
.bilhete{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center;padding:4px 4px 18px;margin-bottom:4px;border-bottom:2px dashed var(--linha);position:relative}
.bilhete:before,.bilhete:after{content:"";position:absolute;bottom:-12px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.bilhete:before{left:-34px}.bilhete:after{right:-34px}
.bilhete label{font-size:12px}
.bilhete input.iata{font:900 clamp(40px,7vw,76px)/1 var(--disp);letter-spacing:-.03em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid var(--linha);border-radius:0;padding:2px 0 6px;width:100%;color:var(--tinta)}
.bilhete input.iata:focus{border-bottom-color:var(--coral)}
.bilhete .dir2{text-align:right}.bilhete .dir2 input{text-align:right}
.bilhete svg{width:84px;height:40px}
.bilhete .cidade{grid-column:1/-1;flex-direction:row;align-items:center;gap:10px}
.bilhete .cidade input{flex:1;font-size:16px}
#extst{display:inline-block;margin-left:12px;vertical-align:middle}
.duas{display:grid;grid-template-columns:1fr 1.25fr;gap:28px;align-items:start}
.duas h2{margin-top:14px}
.fst{margin-top:6px}
.fch{font:700 13px/1 Arial,sans-serif;text-decoration:none;color:var(--tinta);border:2px solid var(--linha);border-radius:99px;padding:8px 13px;background:#fff}
.fch.ok{border-color:var(--otimo)}.fch.erro,.fch.vazio{border-color:var(--sol)}

/* melhores datas */
.grafico{display:flex;align-items:flex-end;gap:5px;height:230px;overflow-x:auto;padding:8px 2px;margin-top:6px}
.gbar{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;height:100%;text-decoration:none;color:var(--tinta-2)}
.gbar .col{flex:1;width:100%;display:flex;align-items:flex-end}
.gbar i{display:block;width:100%;border-radius:10px 10px 3px 3px;background:#c9cde3}
.gbar.b1 i{background:var(--mar)}.gbar.b2 i{background:var(--sol)}.gbar.sem i{background:#eef0f7}
.gbar:hover i{background:var(--coral)}
.gbar .v{font:700 10.5px/1.4 var(--disp);color:var(--tinta)}.gbar .d{font-size:10.5px;margin-top:4px;white-space:nowrap}

@media (max-width:860px){
  .nav{margin-right:0}.nav button{padding:9px 10px 11px;font-size:13px}
  .duas{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}.form .dois{grid-column:1/-1}
  .of.voo{grid-template-columns:1fr}.of.voo>div:first-child{border-right:0;border-bottom:2px dashed var(--linha)}
  .rota{padding-bottom:40px;gap:6px}.rota svg{height:56px}.conta{margin-top:-18px;padding-bottom:64px}.sol{width:150px;height:150px;right:-60px;top:-70px}
  .resumo{display:grid;grid-template-columns:1fr 1fr;gap:14px}.kpi{border:0;margin:0;padding:0;min-width:0}
  .form{padding:16px}.bilhete svg{width:48px}.bilhete:before{left:-28px}.bilhete:after{right:-28px}.bilhete .cidade{flex-direction:column;align-items:stretch}
  .rc.hotel{flex-wrap:wrap}.rc .ft{width:100%;min-height:150px}.rc.hotel .rp{border-left:0;padding-left:0;width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .kpi{padding-right:16px;margin-right:16px;min-width:130px}.kpi b{font-size:24px}
}
</style>
</head>
<body>
<header class="hero" id="hero"><div class="sol" aria-hidden="true"></div><div class="in">
  <div class="marca"><h1>radar<span>.</span>viagens</h1>
  <nav class="nav" id="visao"><button data-v="viagens" class="on">Minhas viagens</button><button data-v="hoteis">Buscar viagem</button><button data-v="ofertas">Passagens em promoção</button><button data-v="anac">Quando comprar</button></nav></div>
  <p id="sub">Carregando…</p>
  <div id="rotaTopo"></div>
</div><svg class="ondas" viewBox="0 0 1200 46" preserveAspectRatio="none" aria-hidden="true"><path d="M0 26 C150 6 300 44 450 24 S750 4 900 24 S1100 40 1200 20 V46 H0Z" fill="#5fd0cc" opacity=".55"/><path d="M0 34 C200 18 380 46 600 30 S950 18 1200 32 V46 H0Z" fill="#f5fbff"/></svg></header>
<div class="wrap">
<div class="bar" id="barra">
  <div class="seg" id="origens"></div>
  <div class="seg" id="tipo">
    <button data-v="todos" class="on">Todos</button><button data-v="nac">Nacionais</button><button data-v="int">Internacionais</button>
  </div>
  <div class="seg" id="regiao">
    <button data-v="todas" class="on">Todas as regiões</button><button data-v="NE">Nordeste</button><button data-v="SE">Sudeste</button><button data-v="S">Sul</button><button data-v="CO">Centro-Oeste</button><button data-v="N">Norte</button>
  </div>
  <input class="busca" id="cidades" type="search" list="lista-cidades" placeholder="Filtrar cidades (ex.: Recife, Maceió)" aria-label="Filtrar cidades">
  <datalist id="lista-cidades"></datalist>
  <div class="seg" id="filtro">
    <button data-v="bons" class="on">Só preço bom</button><button data-v="tudo">Tudo</button>
  </div>
</div>
<div class="resumo" id="resumo"></div>

function notaGoogle(g) {

  bx.notasPend = true;

function datasJanela(f) {
  const out = [], d0 = new Date(f.janIni + "T12:00:00"), d1 = new Date(f.janFim + "T12:00:00"), passo = Math.max(1, +f.passo || 1), dias = Math.max(1, +f.dias || 7);
  for (let d = new Date(d0); d <= d1 && out.length < 80; d.setDate(d.getDate() + passo)) {
    const v = new Date(d); v.setDate(v.getDate() + dias);
    out.push({ida: d.toISOString().slice(0, 10), volta: v.toISOString().slice(0, 10)});
  }
  return out;
}
function buscarDatas(f) {

        <span class="src">${esc(o.fonte)}</span><a class="go2" href="${esc(o.link)}" target="_blank" rel="noopener">Ver ›</a></div></div>`;
  }).join("") : `<div class="vazio">${bx.id ? (bx.rodando ? "Buscando hotéis…" : "Nenhum hotel com esses filtros.") : "Os hotéis aparecem aqui, com o preço de cada site lado a lado."}</div>`;
  const oh = $("#ordh"); if (oh) oh.onclick = e => { e.preventDefault(); bx.ordemH = bx.ordemH === "nota" ? "preco" : "nota"; pintaRes(); };
}

function cardHotel(x, n) {
  const nb = x.nota_booking != null ? Number(x.nota_booking) : x.nota_google != null ? x.nota_google * 2 : null;
  const pal = nb == null ? "" : nb >= 9 ? "Excelente" : nb >= 8.5 ? "Muito bom" : nb >= 8 ? "Muito bom" : "Bom";
  const img = x.foto ? ` style="background-image:url('${esc(x.foto)}')"` : "";
  const tags = [x.estrelas === 5 ? "5 estrelas" : x.estrelas ? x.estrelas + " estrelas" : "", "All inclusive", "Beira-mar"].filter(Boolean);
  return `<article class="hc"><div class="img"${img}>${x.oferta ? `<i>${esc(x.oferta)}</i>` : ""}</div>
    <div class="mid"><h3>${esc(x.n)} <span class="star" style="font-size:14px">${"★".repeat(x.estrelas || 0)}</span></h3>
      ${x.regiao ? `<span class="loc">Zona Hoteleira · ${esc(x.regiao)}</span>` : ""}
      <div class="tg">${tags.map((t, k) => `<span class="${k ? "" : "az"}">${esc(t)}</span>`).join("")}</div>
      <div class="meta">Menor preço já visto: <b>${brl(x.min)}</b> ${varPct(x.ini, x.hoje)}</div>
      ${spark(x.hist)}</div>
    <div class="dir">${nb != null ? `<div class="sc"><div><b>${pal}</b>${x.nota_booking != null ? "nota Booking" : "nota Google"}</div><span class="nb">${nb.toFixed(1).replace(".", ",")}</span></div>` : ""}
      <div class="pn" style="margin-top:auto">${n} noites, 2 adultos</div>
      <div class="vl">${brl(x.hoje)}</div><div class="pn">${brl(Math.round(x.hoje / n))} por noite · impostos incluídos</div>
      ${x.link ? `<a class="go" href="${esc(x.link)}" target="_blank" rel="noopener">Ver disponibilidade ›</a>` : ""}</div></article>`;
}

function renderViagens() {
  const vs = ((V && V.viagens) || []).filter(v => v.ativo !== false), it = (V && V.itens) || {};
  const al = (V && V.alertas) || [];
  const voo = vs.find(v => v.tipo === "voo"), vi = voo && it[voo.id];
  const menorVoo = vi ? ultimo(vi.hist) : null;
  let menorHotel = null;
  vs.filter(v => v.tipo === "hotel").forEach(v => Object.values((it[v.id] || {}).hoteis || {}).forEach(x => { const p = ultimo(x.hist); if (p && (!menorHotel || p < menorHotel)) menorHotel = p; }));
  $("#resumo").innerHTML = `<div class="kpi"><b>${brl(menorVoo)}</b><span>voo mais barato · ${voo ? esc(voo.origem + " → " + voo.destino) : "–"} (${voo ? voo.adultos || 1 : ""} adultos)</span></div>
    <div class="kpi"><b>${brl(menorHotel)}</b><span>hotel all inclusive mais barato · 7 noites</span></div>
    <div class="kpi"><b>${menorVoo && menorHotel ? brl(menorVoo + menorHotel) : "–"}</b><span>viagem completa (voo + hotel)</span></div>
    <div class="kpi"><b>${al.length}</b><span>alertas de queda nos últimos 30 dias</span></div>`;
  let h = al.slice(0, 6).map(a => `<div class="alerta">🔔 <b>${esc(a.item)}</b> ${esc(a.extra || "")} · ${esc(a.viagem)}: ${brl(a.de)} → <b>${brl(a.para)}</b> <b class="q">−${Math.round(a.queda * 100)}%</b> <span class="meta">(${dataBR(a.dia)})</span></div>`).join("");
  if (!vs.length) h += `<div class="vazio">Nenhuma viagem monitorada ainda. Use a aba <b>Buscar viagem</b> ou o formulário no fim desta página.</div>`;
  for (const v of vs) {
    const i = it[v.id] || {};
    const fonte = i.fonte ? ` · fonte: ${esc(i.fonte)}` : i.atualizado ? ` · atualizado em ${dataBR(i.atualizado)}` : "";
    if (v.tipo === "voo") {
      const nome = o => o.paradas ? o.paradas + (o.paradas > 1 ? " paradas" : " parada") : "direto";
      const op = (i.opcoes || []).slice(0, 4).map(o => `<div><span>${esc(o.cias.join(" + "))} · ${nome(o)}${o.duracao ? " · " + Math.floor(o.duracao / 60) + "h" + String(o.duracao % 60).padStart(2, "0") : ""}</span><b>${brl(o.preco)}</b></div>`).join("");
      const g = i.google ? `Google: <b>${{low: "preço baixo", typical: "preço típico", high: "preço alto"}[i.google.nivel] || i.google.nivel}</b>${i.google.faixa ? ` (faixa ${brl(i.google.faixa[0])}–${brl(i.google.faixa[1])})` : ""}` : "";
      h += `<h2>${esc(v.nome)}</h2><p class="sub">${esc(v.origem)} → ${esc(v.destino)} · ${dataBR(v.ida)} a ${dataBR(v.volta)} · ${v.adultos || 1} adultos, ida e volta${fonte}</p>
        <div class="of voo"><div><div class="meta">Menor preço hoje</div><div class="preco">${brl(ultimo(i.hist))}</div><div class="meta">Menor já visto: <b>${brl(minimo(i.hist))}</b> ${varPct(primeiro(i.hist), ultimo(i.hist))}<br>${g}</div>${spark(i.hist)}
        <div class="links" style="margin-top:8px"><a target="_blank" rel="noopener" href="https://www.google.com/travel/flights?hl=pt-BR&curr=BRL&q=${encodeURIComponent(`Flights from ${v.origem} to ${v.destino} on ${v.ida} through ${v.volta} for ${v.adultos || 1} adults`)}">Google Voos</a><a target="_blank" rel="noopener" href="https://www.kayak.com.br/flights/${v.origem}-${v.destino}/${v.ida}/${v.volta}/${v.adultos || 1}adults?sort=price_a">Kayak</a><a target="_blank" rel="noopener" href="https://www.decolar.com/shop/flights/results/roundtrip/${v.origem}/${v.destino}/${v.ida}/${v.volta}/${v.adultos || 1}/0/0">Decolar</a></div></div>
        <div class="opc">${op || '<div class="meta">Aguardando a primeira busca do robô.</div>'}</div></div>`;
    } else {
      const n = noites(v);
      let hs = Object.entries(i.hoteis || {}).map(([nm, x]) => ({n: nm, ...x, hoje: ultimo(x.hist), min: minimo(x.hist), ini: primeiro(x.hist), adulto: /adult|só adultos/i.test(nm + " " + (x.regiao || ""))})).filter(x => x.hoje);
      const total = hs.length;
      if (hst.teto) hs = hs.filter(x => x.hoje <= 14000);
      if (hst.so5) hs = hs.filter(x => x.estrelas === 5);
      if (hst.adultos) hs = hs.filter(x => x.adulto);
      hs.sort(hst.ordem === "nota" ? (a, b) => ((b.nota_booking || b.nota_google * 2 || 0) - (a.nota_booking || a.nota_google * 2 || 0)) || a.hoje - b.hoje : (a, b) => a.hoje - b.hoje);
      const f = {destino: v.q.replace(/^(resorts |hotéis )?(all inclusive )?/i, ""), checkin: v.checkin, checkout: v.checkout, adultos: v.adultos || 2, estrelas: v.estrelas, nota: String(v.nota_min || ""), ai: v.all_inclusive, praia: v.beira_mar};
      h += `<h2>${esc(v.nome)}</h2><p class="sub">${dataBR(v.checkin)} a ${dataBR(v.checkout)} · ${n} noites · ${v.adultos || 2} adultos · preço total da estadia com impostos · ${hs.length} de ${total} hotéis${fonte}</p>
        <div class="chips" data-v="${esc(v.id)}"><button data-k="teto" class="${hst.teto ? "on" : ""}">Até R$ 14 mil</button><button data-k="so5" class="${hst.so5 ? "on" : ""}">Só 5 estrelas</button><button data-k="adultos" class="${hst.adultos ? "on" : ""}">Só adultos</button><button data-k="ordem" class="${hst.ordem === "nota" ? "on" : ""}">${hst.ordem === "nota" ? "Ordenado por nota" : "Ordenado por preço"}</button></div>`;
      h += hs.length ? `<div class="lh">${hs.map(x => cardHotel(x, n)).join("")}</div>` : `<div class="vazio">${total ? "Nenhum hotel com esses filtros." : "Aguardando a primeira busca do robô."}</div>`;
      h += `<div class="links" style="margin-top:12px">${linksHotel(f)}</div>`;
    }
  }
  h += `<h2>Monitorar outro voo</h2><p class="sub">Para hotéis, use a aba <b>Buscar viagem</b>.</p><div class="form" id="fv">
    <label>Origem (código)<input name="origem" value="CNF"></label><label>Destino (código)<input name="destino" placeholder="ex.: CUN, REC, LIS"></label>
    <label>Ida<input type="date" name="ida"></label><label>Volta<input type="date" name="volta"></label><label>Adultos<input type="number" min="1" max="8" name="adultos" value="2"></label>
    <div class="full"><a class="btn" id="mv" target="_blank" rel="noopener">🔔 Monitorar este voo</a></div></div>`;
  $("#lista").innerHTML = h;
  document.querySelectorAll(".chips").forEach(c => c.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const k = b.dataset.k; if (k === "ordem") hst.ordem = hst.ordem === "nota" ? "preco" : "nota"; else hst[k] = !hst[k];
    renderViagens();
  }));
  const upd = () => { const f = lerForm("#fv"); $("#mv").href = issueLink(`${f.origem}-${f.destino} ${f.ida}`, {tipo: "voo", nome: `${f.origem.toUpperCase()} → ${f.destino.toUpperCase()} (${dataBR(f.ida)}–${dataBR(f.volta)})`, origem: f.origem.toUpperCase(), destino: f.destino.toUpperCase(), ida: f.ida, volta: f.volta, adultos: +f.adultos, queda_alerta: 0.05}); };
  $("#fv").addEventListener("input", upd); upd();
}

function opcoes() {
  const nomes = new Set(D.ofertas.filter(o => o.origem === st.origem).map(o => o.destino));
  if (A) Object.entries(A.rotas).forEach(([k, r]) => { if (k.startsWith(st.origem + "|")) nomes.add(r.destino); });
  $("#lista-cidades").innerHTML = [...nomes].sort((a, b) => a.localeCompare(b, "pt-BR")).map(n => `<option value="${esc(n)}">`).join("");
}

const CIDADE = {CNF: "Belo Horizonte", CUN: "Cancún", GRU: "São Paulo", GIG: "Rio de Janeiro", REC: "Recife", SSA: "Salvador", PUJ: "Punta Cana", LIS: "Lisboa", MCO: "Orlando", MIA: "Miami", FOR: "Fortaleza", MCZ: "Maceió", NAT: "Natal", FLN: "Florianópolis"};
function pintaTopo() {
  const hero = $("#hero"), el = $("#rotaTopo"); if (!el) return;
  const vs = ((typeof V !== "undefined" && V && V.viagens) || []).filter(v => v.ativo !== false);
  const voo = vs.find(v => v.tipo === "voo");
  if (st.visao !== "viagens" || !voo) { hero.classList.add("curto"); el.innerHTML = ""; return; }
  hero.classList.remove("curto");
  const it = (V.itens || {});
  const pv = ultimo((it[voo.id] || {}).hist || {});
  let ph = null; vs.filter(v => v.tipo === "hotel").forEach(v => Object.values((it[v.id] || {}).hoteis || {}).forEach(x => { const p = ultimo(x.hist); if (p && (!ph || p < ph)) ph = p; }));
  const dias = Math.max(0, Math.ceil((new Date(voo.ida + "T12:00:00") - new Date()) / 864e5));
  el.innerHTML = `<div class="rota"><div class="cod">${esc(voo.origem)}<small>${esc(CIDADE[voo.origem] || "")}</small></div>
    <svg viewBox="0 0 400 110" preserveAspectRatio="none" aria-hidden="true"><path class="arco" d="M6 104 Q200 -40 394 104"/><g transform="translate(262 22) rotate(28)"><path class="aviao" d="M-14 -2 l10 0 l8 -12 l5 0 l-4 12 l9 0 l4 -5 l3 0 l-2 7 l2 7 l-3 0 l-4 -5 l-9 0 l4 12 l-5 0 l-8 -12 l-10 0 z"/></g></svg>
    <div class="cod dir">${esc(voo.destino)}<small>${esc(CIDADE[voo.destino] || "")}</small></div></div>
    <div class="conta"><b>faltam ${dias} dias</b><span>${dataBR(voo.ida)} a ${dataBR(voo.volta)}${pv && ph ? `, voo + hotel a partir de <b style="display:inline;font:inherit;font-weight:700">${brl(pv + ph)}</b>` : ""}</span></div>`;
}
function render() {
  const anac = st.visao === "anac", extra = st.visao === "viagens" || st.visao === "hoteis";
  opcoes();
  $("#tipo").style.display = $("#filtro").style.display = anac || extra ? "none" : "";
  $("#regiao").style.display = extra || (!anac && st.tipo === "int") ? "none" : "";
  $("#barra").style.display = extra ? "none" : "";
  try { history.replaceState(null, "", "#" + st.visao); } catch (e) {}
  pintaTopo();
  if (st.visao === "viagens") return renderViagens();
  if (st.visao === "hoteis") return renderHoteis();
  if (anac) return renderAnac();
  const og = D.origens.find(x => x.id === st.origem);
  let ofs = D.ofertas.filter(o => o.origem === st.origem);
  if (st.tipo === "nac") ofs = ofs.filter(o => o.nacional);
  if (st.tipo === "int") ofs = ofs.filter(o => !o.nacional);
  else if (st.regiao !== "todas") ofs = ofs.filter(o => o.nacional && regiaoDe(o.codigo) === st.regiao);
  ofs = ofs.filter(o => bateCidade(o.destino, o.codigo));
  const bons = ofs.filter(o => o.nivel === "bom" || o.nivel === "otimo");
  const menor = ofs.reduce((m, o) => !m || o.preco < m.preco ? o : m, null);
  const top = bons.reduce((m, o) => !m || (o.desconto || 0) > (m.desconto || 0) ? o : m, null);
  $("#resumo").innerHTML = `
    <div class="kpi"><b>${bons.length}</b><span>passagens com preço bom</span></div>
    <div class="kpi"><b>${ofs.length}</b><span>ofertas monitoradas</span></div>
    <div class="kpi"><b>${menor ? brl(menor.preco) : "–"}</b><span>menor preço${menor ? " · " + esc(menor.destino) : ""}</span></div>
    <div class="kpi"><b>${top && top.desconto ? "−" + Math.round(top.desconto * 100) + "%" : "–"}</b><span>maior desconto${top && top.desconto ? " · " + esc(top.destino) : ""}</span></div>`;
  const mostra = st.filtro === "bons" ? bons : ofs;
  const meses = [...new Set(ofs.map(o => o.ida.slice(0, 7)))].sort();
  const ord = {otimo: 0, bom: 1, observacao: 2, normal: 3};
  let html = "";
  for (const m of meses) {
    const doMes = mostra.filter(o => o.ida.startsWith(m)).sort((a, b) => ord[a.nivel] - ord[b.nivel] || (b.desconto || 0) - (a.desconto || 0) || a.preco - b.preco);
    html += `<h2>${nomeMes(m)} <small>${doMes.length} ${st.filtro === "bons" ? "com preço bom" : "ofertas"}</small></h2>`;
    html += doMes.length ? `<div class="grid">${doMes.map(o => card(o, og)).join("")}</div>`
      : `<div class="vazio">Nenhuma passagem com preço bom neste mês por enquanto.</div>`;
  }
  if (!meses.length) html = `<div class="vazio">Ainda não há dados para ${esc(og.nome)}. As origens secundárias entram em rodízio — aparecem nos primeiros dias de execução.</div>`;
  else if (st.filtro === "bons" && !bons.length && ofs.some(o => o.nivel === "observacao"))
    html = `<div class="vazio">O radar ainda está formando o histórico (precisa de ${D.dias_minimos_historico} dias por rota para dizer o que é barato). Clique em <b>Tudo</b> para ver os preços já coletados.</div>` + html;
  $("#lista").innerHTML = html;
}

function seg(id, chave) {
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    st[chave] = b.dataset.v;
    [...$(id).children].forEach(x => x.classList.toggle("on", x === b));
    render();
  });
}

const pega = u => fetch(u + "?t=" + Date.now()).then(r => { if (!r.ok) throw 0; return r.json(); });
Promise.all([pega("data/deals.json"), pega("data/anac.json").catch(() => null), pega("aeroportos_br.json").catch(() => ({})), pega("data/viagens.json").catch(() => null)]).then(([d, a, ap, v]) => {
  D = d; A = a; V = v;
  const hv = location.hash.slice(1); if (["ofertas", "viagens", "hoteis", "anac"].includes(hv)) { st.visao = hv; [...$("#visao").children].forEach(x => x.classList.toggle("on", x.dataset.v === hv)); }
  Object.values(ap).forEach(v => UF[v[0]] = v[2]);
  st.origem = (d.origens.find(o => o.principal) || d.origens[0]).id;
  $("#origens").innerHTML = d.origens.map(o => `<button data-v="${o.id}" class="${o.id === st.origem ? "on" : ""}">${esc(o.nome)}</button>`).join("");
  $("#sub").textContent = `Voos e hotéis monitorados todo dia · passagens atualizadas em ${d.atualizado.slice(8, 10)}/${d.atualizado.slice(5, 7)} às ${d.atualizado.slice(11)}`;
  $("#rodape").innerHTML = `Histórico ANAC: só voos nacionais; mostra em que meses a passagem costuma ser <b>vendida</b> mais barata (mês da compra, não da viagem). “Preço bom” = pelo menos 15% abaixo da mediana do histórico da rota, ou classificado como baixo pelo Google Flights. Buscas usadas no mês: <b>${d.buscas_no_mes}</b> de ${d.limite_mensal}. Confira sempre o preço final no site antes de comprar.`;
  seg("#visao", "visao"); seg("#origens", "origem"); seg("#tipo", "tipo"); seg("#regiao", "regiao");
  try { st.cidades = localStorage.getItem("radar-cidades") || ""; } catch (e) {}
  $("#cidades").value = st.cidades;
  $("#cidades").addEventListener("input", e => { st.cidades = e.target.value; try { localStorage.setItem("radar-cidades", st.cidades); } catch (e2) {} render(); }); seg("#filtro", "filtro");
  window.addEventListener("hashchange", () => { const hv = location.hash.slice(1); if (hv !== st.visao && ["ofertas", "viagens", "hoteis", "anac"].includes(hv)) { st.visao = hv; [...$("#visao").children].forEach(x => x.classList.toggle("on", x.dataset.v === hv)); render(); } });
  render();
}).catch(() => { $("#sub").textContent = "Ainda sem dados — rode o robô uma vez (aba Actions no GitHub)."; });
</script>
</body>
</html>
